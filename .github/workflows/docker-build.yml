name: Docker Build and Push to GHCR

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: get-version
        run: |
          if git describe --tags --abbrev=0 > /dev/null 2>&1; then
            VERSION=$(git describe --tags --abbrev=0)
          else
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sisp:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sisp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_TAG=${{ needs.prepare.outputs.version }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            NODE_ENV=production
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            WHATSAPP_API_KEY=${{ secrets.WHATSAPP_API_KEY }}
            WHATSAPP_API_URL=${{ secrets.WHATSAPP_API_URL }}
            WHATSAPP_ADMIN_NUMBERS=${{ secrets.WHATSAPP_ADMIN_NUMBERS }}
            WHATSAPP_ENABLED=${{ secrets.WHATSAPP_ENABLED }}